<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVD Travels | Vehicle Booking</title>

    <!-- Bootstrap 5 CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- =============================================
         SPLASH SCREEN
         index.html → auto-navigates → login.html
         ============================================= -->
    <section id="splash" class="splash-screen d-flex align-items-center justify-content-center text-center">

        <!-- Decorative background rings -->
        <div class="splash-bg-rings" aria-hidden="true">
            <span class="bg-ring bg-ring-1"></span>
            <span class="bg-ring bg-ring-2"></span>
        </div>

        <!-- Main splash content -->
        <div class="container splash-content">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-6">

                    <!-- Brand logo badge -->
                    <div class="splash-logo mx-auto d-flex align-items-center justify-content-center">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SVD Travels car logo">
                            <path d="M5.4 11.5 6.8 8.3a2.2 2.2 0 0 1 2-1.3h6.4a2.2 2.2 0 0 1 2 1.3l1.4 3.2"
                                  stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M3.6 11.5h16.8a1 1 0 0 1 1 1v3.4a2 2 0 0 1-2 2h-1.7a2.3 2.3 0 0 0-4.6 0h-4.2a2.3 2.3 0 0 0-4.6 0H4.6a2 2 0 0 1-2-2v-3.4a1 1 0 0 1 1-1z"
                                  stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/>
                            <circle cx="7.4" cy="17.4" r="1.05" stroke="#fff" stroke-width="1.4"/>
                            <circle cx="16.6" cy="17.4" r="1.05" stroke="#fff" stroke-width="1.4"/>
                        </svg>
                    </div>

                    <!-- App name -->
                    <h1 class="app-name"><span class="name-wheel">SVD</span> <span class="name-wise">Travels</span></h1>

                    <!-- Tagline -->
                    <p class="app-tagline mb-0">
                        Book your ride &amp; rent a vehicle — anywhere, anytime.
                    </p>

                    <!-- Continue button -->
                    <a id="btnContinue" href="login.html" role="button" class="btn btn-continue mt-4">
                        Continue &nbsp;&raquo;
                    </a>

                </div>
            </div>
        </div>

        <!-- Vehicle-themed visual area (bottom scene) -->
        <div class="vehicle-scene" aria-hidden="true">
            <div class="scene-glow"></div>
            <div class="scene-sky"></div>

            <!-- City skyline silhouette -->
            <div class="skyline">
                <span class="bldg b1"></span>
                <span class="bldg b2"></span>
                <span class="bldg b3"></span>
                <span class="bldg b4"></span>
            </div>

            <div class="road"></div>
        </div>

    </section>

    <!-- jQuery (CDN) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap JS bundle (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/main.js"></script>

</body>
</html>
